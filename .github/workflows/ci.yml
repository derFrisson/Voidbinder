name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres for the integration tests of the site and the API (DATABASE_URL below).
    services:
      postgres:
        # Docker Hub's official image through AWS's mirror: anonymous Docker Hub pulls from
        # GitHub's shared runner IPs hit the rate limit.
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: voidbinder
          POSTGRES_PASSWORD: voidbinder
          POSTGRES_DB: voidbinder
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U voidbinder -d voidbinder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Real browser for the axe-core accessibility test (apps/site/test/a11y.test.ts).
      - run: pnpm --filter site exec playwright install --with-deps chromium
      # The site and the API migrate in parallel and both create the `drizzle` schema for their
      # journals; two concurrent CREATE SCHEMA IF NOT EXISTS can fail, so it exists beforehand.
      - run: docker exec ${{ job.services.postgres.id }} psql -U voidbinder -d voidbinder -c 'CREATE SCHEMA IF NOT EXISTS drizzle'
      - run: pnpm test
        env:
          DATABASE_URL: postgres://voidbinder:voidbinder@localhost:5434/voidbinder
      - run: pnpm build
