# Plausible Community Edition (VB-74) on the database VPS, under /opt/plausible.
# Based on github.com/plausible/community-edition v3.2.1 (compose.yml + clickhouse/); keep the diff
# to upstream small so a version bump is a tag change. Our changes: pinned patch tags, bind mounts
# under /opt/plausible/data, memory limits, restart unless-stopped, port 8000 on loopback only
# (Caddy on the host terminates TLS). Runbook: docs/guides/analytics-plausible.md.
services:
  plausible_db:
    # Upstream's tested major (16), pinned to the patch release.
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      start_period: 1m

  plausible_events_db:
    # Upstream's tested line (24.12), pinned to the patch release.
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1']
      start_period: 1m

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./data/plausible:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      # https://github.com/plausible/community-edition/wiki/configuration
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - TOTP_VAULT_KEY
      - DISABLE_REGISTRATION
      - ENABLE_EMAIL_VERIFICATION
      - HTTP_PORT
      - DATABASE_URL
      - CLICKHOUSE_DATABASE_URL
      - IP_GEOLOCATION_DB
      - MAXMIND_LICENSE_KEY
      - MAXMIND_EDITION
      - MAILER_ADAPTER
      - MAILER_EMAIL
      - MAILER_NAME
      - SMTP_HOST_ADDR
      - SMTP_HOST_PORT
      - SMTP_USER_NAME
      - SMTP_USER_PWD
      - SMTP_HOST_SSL_ENABLED
